[SERVICE]
    # 指定自定义解析器配置文件路径
    # 该文件包含专门的多行日志解析规则（如mysql慢查询）
    Parsers_File  /fluent-bit/etc/parsers_mysql_slow.conf

# 输入源1：采集cpu日志文件
[INPUT]
    # 使用 tail 插件监控文件变化
    Name            tail
    # 自定义标签，标识为系统指标类日志
    Tag           sys.metric  
    # 系统指标日志文件路径（可能是由其他工具生成的指标数据）
    Path          /var/log/metric_log
    # 检查文件变化的间隔时间（秒）
    Refresh_Interval 10  

[INPUT]
    # 使用 tail 插件监控文件变化
    Name                 tail
    # 自定义标签，标识为mysql慢查询日志
    Tag                  mysql.slow
    # mysql慢查询日志文件路径
    Path                 /var/log/mysql/slow.log
    Read_from_Head       On
    # 跳过超长行，避免解析错误导致进程崩溃
    Skip_Long_Lines      On
    # 检查文件变化的间隔时间（秒）
    Refresh_Interval     10
    # 指定多行解析器名称（需在parsers_mysql_slow.conf中定义）
    # 用于mysql慢查询跨多行的日志条目
    multiline.parser     mysql_slow

##############################################
# 输出插件（转发到 Fluentd）
##############################################
[OUTPUT]
    # 使用 forward 插件将日志转发到Fluentd聚合器
    Name            forward
    # 匹配所有标签的日志（* 是通配符，表示所有输入源）
    Match           *
    # Fluentd 服务地址（使用Docker Compose服务名进行服务发现）
    Host            fluentd
    # Fluentd 监听端口（forward插件的默认端口）
    Port            24224
    # 网络故障时的最大重试次数，防止无限重试消耗资源
    Retry_Limit     10

# 输出源2：同时输出到控制台（用于调试和监控）
[OUTPUT]
    # 使用 stdout 插件在控制台打印日志
    Name          stdout
    # 匹配所有标签的日志
    Match         *
    # 注意：生产环境通常应注释或移除此输出，避免日志重复和性能开销


