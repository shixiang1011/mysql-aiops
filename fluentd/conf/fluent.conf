###############################
# Fluentd 健康检查（monitor_agent）
###############################
<source>
  @type monitor_agent        # 启用监控代理插件，用于收集Fluentd自身运行指标
  bind 0.0.0.0               # 监听所有网络接口
  port 24220                 # 监控服务端口，可通过此端口获取Fluentd运行状态信息
</source>

###############################
# Fluentd 日志输入（forward）
###############################
<source>
  @type forward              # 启用forward输入插件，接收来自Fluent-bit或其他Fluentd节点的日志
  port 24224                 # 转发协议监听端口
  bind 0.0.0.0               # 监听所有网络接口
</source>

###############################
# 处理 collectd 采集的CPU指标数据
###############################
# 第一步：提取log字段中write_log后的JSON部分（现有配置）
<filter sys.metric>          # 过滤系统指标数据
  @type parser               # 使用解析器插件
  key_name log               # 解析log字段内容
  reserve_data true          # 保留所有原始字段
  remove_key_name_field false # 不移除原始的key_name字段
  <parse>
    @type regexp             # 使用正则表达式解析
    # 正则表达式匹配collectd的CPU数据格式，使用命名捕获组提取CPU信息
    expression /write_log values:(?:#012|\s)*(?<log>\[\{.*?\}\])/  # 非贪婪匹配确保只取一个数组

    time_key time            # 指定时间字段
    time_type float          # 时间格式为浮点数（Unix时间戳）
  </parse>
</filter>

# 第二步：将log字段的JSON字符串解析为JSON对象
<filter sys.metric>
  @type parser
  key_name log               # 解析第一步提取的log字段（此时是JSON字符串）
  reserve_data true          # 保留所有字段
  remove_key_name_field false # 保留解析后的log字段
  <parse>
    @type json               # 用JSON解析器处理
    json_parser json         # 使用默认JSON解析器
  </parse>
</filter>

# 第三步：标记异常日志（增加详细调试字段）
<filter sys.metric>
  @type record_transformer
  enable_ruby true
  <record>
    # 直接判断 values[0] 是否大于 80
    status ${(record["plugin"] == "cpu" && record["type"] == "percent" && record["values"].is_a?(Array) && !record["values"].empty? && record["values"][0].to_f > 80) ? "abnormal" : "normal"}

    debug_plugin ${record["plugin"].to_s}
    debug_type ${record["type"].to_s}
    debug_values_content ${record["values"].inspect}
  </record> 
</filter>

<filter mysql.slow>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type regexp
    expression /^(?<header># Time: (?<time>.+)\n# User@Host: (?<user_host>.+)\n# Query_time: (?<query_time>\d+\.\d+)\s+Lock_time: (?<lock_time>\d+\.\d+)\s+Rows_sent: (?<rows_sent>\d+)\s+Rows_examined: (?<rows_examined>\d+))(?<sql_body>[\s\S]*)$/
  </parse>
</filter>

<filter mysql.slow>
  @type record_transformer
  enable_ruby true
  <record>
    # 第一步：提取表名数组
    tables ${ sql = record["sql_body"].to_s; pattern = /(?:FROM|JOIN)\s+(?:(?<schema1>[a-zA-Z_][a-zA-Z0-9_]*)\.(?<table1>[a-zA-Z_][a-zA-Z0-9_]*)|(?<schema2>`[^`]+`)\.(?<table2>`[^`]+`)|(?<schema3>[a-zA-Z_][a-zA-Z0-9_]*)\.(?<table3>`[^`]+`)|(?<schema4>`[^`]+`)\.(?<table4>[a-zA-Z_][a-zA-Z0-9_]*)|(?<table5>[a-zA-Z_][a-zA-Z0-9_]*)|(?<table6>`[^`]+`))(?:\s|$)/; matches = sql.scan(pattern); tables = []; matches.each { |m| schema1, table1, schema2, table2, schema3, table3, schema4, table4, table5, table6 = m; if schema1 && table1; tables << "#{schema1}.#{table1}"; elsif schema2 && table2; tables << "#{schema2}.#{table2}"; elsif schema3 && table3; tables << "#{schema3}.#{table3}"; elsif schema4 && table4; tables << "#{schema4}.#{table4}"; elsif table5 && !["si","i","u","cs","s"].include?(table5); tables << table5; elsif table6; tables << table6; end }; tables.uniq }
  </record>
</filter>

<filter mysql.slow>
  @type record_transformer
  enable_ruby true
  <record>
    # 第二步：基于tables字段生成其他字段
    tables_str ${ record["tables"].join(",") }
    table_count ${ record["tables"].size }
    
    # 数值类型转换
    query_time_float ${ record["query_time"].to_f }
    lock_time_float ${ record["lock_time"].to_f }
    rows_sent_int ${ record["rows_sent"].to_i }
    rows_examined_int ${ record["rows_examined"].to_i }
  </record>
</filter>

<filter mysql.slow>
  @type record_transformer
  remove_keys sql_body,header
</filter>

###############################
# 输出到 Elasticsearch 8、stdout 和 HTTP端点
###############################
<match *.**>                 # 匹配所有标签的日志Tag
  @type copy                 # 复制插件，将日志同时发送到多个输出目的地

  # 第一个输出目标：Elasticsearch
  <store>
    @id es_output
    @type elasticsearch      # 输出到Elasticsearch
    host elasticsearch       # ES主机地址（可以是主机名或IP）
    port 9200                # ES服务端口
    scheme http              # 使用HTTP协议
    logstash_format true     # 使用Logstash格式索引命名
    logstash_prefix fluentd-${tag}  # 索引前缀加上标签名
    logstash_dateformat %Y%m%d      # 索引日期格式年月日
    include_tag_key true     # 在输出中包含标签字段
    tag_key @log_name        # 标签字段的键名
    flush_interval 1s        # 刷新间隔1秒
  </store>

  <store>
    @id output
    @type stdout         # 输出到控制台/stdout
    key status           # 字段
    pattern ^normal$     # 正则匹配
  </store>

  <store>
    @type relabel              # 使用 relabel 输出插件进行标签重路由
    @label @abnormal           # 将所有匹配到的数据重新路由到 @abnormal 标签处理流程
  </store>

  <store>
    @id http_output_slow_query
    @type http               # HTTP输出插件
    endpoint http://192.168.0.90:5001/analyze-slow-query  # 日志分析API端点，host.docker.internal是Docker特殊主机名，指向宿主机
    http_method post         # 使用POST方法发送

    <format>
      @type json             # 数据格式为JSON
    </format>

    <buffer>
      # 缓冲配置区块：控制数据如何缓冲和重试发送
      # 用于提高网络输出的可靠性和性能，避免频繁的小数据包发送
      
      # 缓冲刷新间隔：每2秒强制刷新一次缓冲区
      # - 即使缓冲区未满，也会每2秒发送一次累积的数据
      # - 平衡实时性和网络效率：太短会增加网络请求，太长会降低实时性
      flush_interval 2s
      
      # 重试策略：使用指数退避算法
      # - 第一次重试等待：基础等待时间
      # - 第二次重试等待：基础时间 × 2
      # - 第三次重试等待：基础时间 × 4，依此类推
      # - 避免网络拥塞时的大量重试导致雪崩效应
      retry_type exponential_backoff
      
      # 基础重试等待时间：第一次重试前等待1秒
      # - 首次重试的初始等待间隔
      # - 后续重试会根据指数退避算法递增
      retry_wait 1s
      
      # 最大重试间隔：单次重试最多等待30秒
      # - 防止指数增长后的等待时间过长
      # - 即使使用指数退避，也不会超过30秒的间隔
      retry_max_interval 30s
      
      # 总重试超时时间：10分钟后放弃重试
      # - 从第一次失败开始计算，10分钟后停止重试
      # - 防止因为长期不可用的目标服务导致无限重试
      # - 超时后数据可能会被丢弃（取决于配置）
      retry_timeout 10m
    </buffer>
  </store>
</match>


###############################
# 异常日志输出到 HTTP端点
###############################
<label @abnormal>
  # 这个 filter 块会对所有进入 @abnormal 标签的数据进行过滤
  # 只有通过这个过滤器的数据才会继续流向后面的 match 块
  <filter **>
    @type grep                # 使用 grep 过滤器
    <regexp>
      key status              # 检查每条记录的 status 字段
      pattern ^abnormal$      # 只保留 status 值为 "abnormal" 的记录
    </regexp>
  </filter>

  # 这个 match 块会接收到经过上面 filter 过滤后的数据
  <match **>
    @id http_output
    @type http               # HTTP输出插件
    endpoint http://192.168.0.90:5001/analyze-fluentd-log  # 日志分析API端点，host.docker.internal是Docker特殊主机名，指向宿主机
    http_method post         # 使用POST方法发送

    <format>
      @type json             # 数据格式为JSON
    </format>

    <buffer>
      # 缓冲配置区块：控制数据如何缓冲和重试发送
      # 用于提高网络输出的可靠性和性能，避免频繁的小数据包发送
      
      # 缓冲刷新间隔：每2秒强制刷新一次缓冲区
      # - 即使缓冲区未满，也会每2秒发送一次累积的数据
      # - 平衡实时性和网络效率：太短会增加网络请求，太长会降低实时性
      flush_interval 2s
      
      # 重试策略：使用指数退避算法
      # - 第一次重试等待：基础等待时间
      # - 第二次重试等待：基础时间 × 2
      # - 第三次重试等待：基础时间 × 4，依此类推
      # - 避免网络拥塞时的大量重试导致雪崩效应
      retry_type exponential_backoff
      
      # 基础重试等待时间：第一次重试前等待1秒
      # - 首次重试的初始等待间隔
      # - 后续重试会根据指数退避算法递增
      retry_wait 1s
      
      # 最大重试间隔：单次重试最多等待30秒
      # - 防止指数增长后的等待时间过长
      # - 即使使用指数退避，也不会超过30秒的间隔
      retry_max_interval 30s
      
      # 总重试超时时间：10分钟后放弃重试
      # - 从第一次失败开始计算，10分钟后停止重试
      # - 防止因为长期不可用的目标服务导致无限重试
      # - 超时后数据可能会被丢弃（取决于配置）
      retry_timeout 10m
    </buffer>
  </match>
</label>
